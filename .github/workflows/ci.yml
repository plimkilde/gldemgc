name: CI

on: [push, pull_request]

jobs:
  test:
    name: "gcpcheck usage"
    strategy:
      matrix:
        runner: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v6
    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.79.0
        cache: true
    - run: pixi run gcpcheck -h
